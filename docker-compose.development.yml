services:
  mariadb:
    image: mariadb:10.5.12          # the same version as CI, and as the spec's manual verification
    ports:
      - '127.0.0.1:3306:3306'   # loopback only: never every interface
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: development   # matches the file name and NODE_ENV. Does not mix with CI's live one
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4                # the queue's store. A project with any job cannot drop it
    ports:
      - '127.0.0.1:6379:6379'   # loopback only
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.15.0
    profiles:
      - elasticsearch
    ports:
      - '127.0.0.1:9200:9200'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'

  kafka:
    image: bitnami/kafka:3.8
    profiles:
      - kafka
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

  qdrant:
    image: qdrant/qdrant:v1.12.1
    profiles:
      - qdrant
    ports:
      - '127.0.0.1:6333:6333'

  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: server /data --console-address ':9001'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
